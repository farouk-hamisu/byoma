<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Staff sign in · Fortuna Skin</title>
  <link rel="icon" type="image/jpeg" href="/public/furtunaskin.jpg" />
  <script src="/env.js"></script>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module" src="/js/admin/login.js"></script>
</head>
<body data-admin-guard="login">
  <main class="login-wrap">
    <form class="card login-card" data-login-form novalidate>
      <img class="login-card__logo" src="/public/furtunaskin.jpg" alt="Fortuna Skin" width="64" height="64" />
      <h1>Fortuna Skin</h1>
      <p class="admin-page-subtitle" style="text-align:center;margin-bottom:var(--space-5)">
        Sign in to the Fortuna Skin partnerships dashboard.
      </p>

      <div class="alert alert--danger" data-login-error hidden role="alert"></div>

      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label class="field__label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password" autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn btn--primary btn--lg" data-login-submit>Sign in</button>

      <p class="login-card__foot">
        <a href="/">← Back to public site</a>
      </p>
    </form>
  </main>
</body>
</html>
